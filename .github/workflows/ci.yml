name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax-and-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: node --check every JS file
        run: |
          set -e
          count=0
          while IFS= read -r -d '' f; do
            node --check "$f"
            count=$((count + 1))
          done < <(find . -type f -name '*.js' -not -path './.git/*' -print0)
          echo "checked ${count} JS file(s)"

      - name: READMEs and LICENSE present
        run: |
          test -f README.md
          test -f README.en.md
          test -f LICENSE
          echo "all docs present"
